<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Android Config</title>
    <style>
        :root { --bg: #050505; --fg: #00ff00; --dim: #333; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--fg);
        }
        h1 { font-size: 1.4rem; margin-top: 0; }
        .card {
            background: #111; border: 1px solid var(--dim);
            border-radius: 8px; padding: 1rem; margin-bottom: 1rem;
        }
        label { display: block; margin: 0.6rem 0 0.2rem; font-size: 0.9rem; }
        input[type="range"] { width: 100%; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 0.4rem; background: #000; color: var(--fg);
            border: 1px solid var(--dim); border-radius: 4px;
        }
        .face-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.4rem 0; border-bottom: 1px solid var(--dim);
        }
        .face-row:last-child { border-bottom: none; }
        .switch {
            position: relative; display: inline-block; width: 44px; height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; inset: 0;
            background: #333; transition: .2s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background: white; transition: .2s; border-radius: 50%;
        }
        input:checked + .slider { background: var(--fg); }
        input:checked + .slider:before { transform: translateX(20px); }
        button {
            background: var(--fg); color: #000; border: none;
            padding: 0.6rem 1.2rem; border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        #preview {
            display: grid; grid-template-columns: repeat(37, 1fr);
            width: 100%; max-width: 640px; aspect-ratio: 37 / 8;
            background: #000; border: 1px solid var(--dim); margin-top: 0.5rem;
        }
        #preview div { border-radius: 20%; }
        .status { font-size: 0.85rem; color: #888; }
    </style>
</head>
<body>
    <h1>Reloj Android</h1>

    <div class="card">
        <div class="status">Server port: <span id="port">8080</span></div>
        <div class="status">Current face: <span id="currentFace">-</span></div>
    </div>

    <div class="card">
        <h2>Live Preview</h2>
        <div id="preview"></div>
    </div>

    <div class="card">
        <h2>Faces</h2>
        <div id="faces"></div>
    </div>

    <div class="card">
        <h2>Settings</h2>
        <label for="rotation">Rotation interval (seconds)</label>
        <input id="rotation" type="range" min="5" max="300" step="5">
        <div><span id="rotationValue">10</span>s</div>

        <label for="city">Weather city</label>
        <input id="city" type="text">

        <label for="lat">Latitude</label>
        <input id="lat" type="number" step="any">

        <label for="lon">Longitude</label>
        <input id="lon" type="number" step="any">

        <label for="clockArt">Clock art</label>
        <select id="clockArt">
            <option value="ABSTRACT">Abstract</option>
            <option value="FLOWER">Flower</option>
            <option value="HEART">Heart</option>
            <option value="WEATHER">Weather</option>
            <option value="CALENDAR">Calendar</option>
        </select>

        <br><br>
        <button id="save">Save Settings</button>
    </div>

    <script>
        const API = '/api';

        async function load() {
            const [settings, faces, status] = await Promise.all([
                fetch(`${API}/settings`).then(r => r.json()),
                fetch(`${API}/faces`).then(r => r.json()),
                fetch(`${API}/status`).then(r => r.json())
            ]);

            document.getElementById('port').textContent = settings.serverPort;
            document.getElementById('currentFace').textContent = status.currentFaceName || status.currentFaceId || '-';
            document.getElementById('rotation').value = settings.rotationSeconds;
            document.getElementById('rotationValue').textContent = settings.rotationSeconds;
            document.getElementById('city').value = settings.weatherCity;
            document.getElementById('lat').value = settings.weatherLat;
            document.getElementById('lon').value = settings.weatherLon;
            document.getElementById('clockArt').value = settings.clockArt || 'ABSTRACT';

            const facesEl = document.getElementById('faces');
            facesEl.innerHTML = '';
            faces.forEach(face => {
                const row = document.createElement('div');
                row.className = 'face-row';
                row.innerHTML = `<span>${face.name}</span>
                    <label class="switch">
                        <input type="checkbox" data-id="${face.id}" ${face.enabled ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>`;
                facesEl.appendChild(row);
            });
        }

        document.getElementById('rotation').addEventListener('input', e => {
            document.getElementById('rotationValue').textContent = e.target.value;
        });

        document.getElementById('save').addEventListener('click', async () => {
            const enabled = Array.from(document.querySelectorAll('#faces input[type="checkbox"]'))
                .filter(cb => cb.checked).map(cb => cb.dataset.id);

            const settings = await fetch(`${API}/settings`).then(r => r.json());
            settings.enabledFaces = enabled;
            settings.rotationSeconds = parseInt(document.getElementById('rotation').value, 10);
            settings.weatherCity = document.getElementById('city').value;
            settings.weatherLat = parseFloat(document.getElementById('lat').value);
            settings.weatherLon = parseFloat(document.getElementById('lon').value);
            settings.clockArt = document.getElementById('clockArt').value;

            await fetch(`${API}/settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            });
            alert('Saved');
            load();
        });

        async function updatePreview() {
            try {
                const preview = await fetch(`${API}/preview`).then(r => r.json());
                const container = document.getElementById('preview');
                if (container.children.length !== preview.pixels.length) {
                    container.innerHTML = '';
                    preview.pixels.forEach(() => {
                        const div = document.createElement('div');
                        container.appendChild(div);
                    });
                }
                Array.from(container.children).forEach((div, i) => {
                    div.style.backgroundColor = preview.pixels[i];
                });
            } catch (e) { /* ignore */ }
        }

        load();
        setInterval(updatePreview, 500);
        setInterval(load, 5000);
    </script>
</body>
</html>
